worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 120m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/wasm;

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html/app;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://st.max.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://tiles.openfreemap.org https://tile.openstreetmap.org; worker-src 'self' blob:; frame-src 'self'; frame-ancestors 'self' https://max.ru https://*.max.ru" always;

        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        location ^~ /api/v1/moderation {
            return 404;
        }

        location = /api/v1/realtime {
            include /etc/nginx/proxy.conf;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
        }

        location /api/ {
            include /etc/nginx/proxy.conf;
            proxy_buffering off;
        }

        location /private-media/ {
            return 404;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1h;
        }

        location /map/ {
            try_files $uri =404;
        }

        location = /index.html {
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 8081;
        root /usr/share/nginx/html/moderation;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'" always;

        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        location /api/ {
            include /etc/nginx/proxy.conf;
            proxy_buffering off;
        }

        location /private-media/ {
            return 404;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1h;
        }

        location = /index.html {
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
