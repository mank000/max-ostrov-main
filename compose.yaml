name: ostrov-demo

services:
  secrets:
    image: alpine:3.23
    restart: "no"
    network_mode: none
    volumes:
      - secrets:/secrets
      - ./docker/init-secrets.sh:/init-secrets.sh:ro
    entrypoint: [sh, /init-secrets.sh]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kutezh
      POSTGRES_USER: kutezh
      POSTGRES_PASSWORD_FILE: /run/ostrov-secrets/postgres_password
    volumes:
      - postgres:/var/lib/postgresql/data
      - secrets:/run/ostrov-secrets:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: demo
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      KUTEZH_HTTP_ADDR: 0.0.0.0:8080
      KUTEZH_DATABASE_URL_FILE: /run/ostrov-secrets/database_url
      KUTEZH_MODERATION_OTP_KEY_FILE: /run/ostrov-secrets/moderation_key
      KUTEZH_MEDIA_DIR: /var/lib/kutezh/media
      KUTEZH_MEDIA_X_ACCEL: "false"
      KUTEZH_SESSION_COOKIE_SECURE: "false"
      KUTEZH_BOT_TOKEN: ""
      KUTEZH_PUBLIC_URL: http://localhost:${APP_PORT:-8080}
      KUTEZH_MODERATION_URL: http://localhost:${MODERATION_PORT:-8081}
      KUTEZH_TEXT_AI_MODE: "off"
      KUTEZH_GEOCODING_AUTOCOMPLETE: "false"
      KUTEZH_FACE_AI_URL: ""
      KUTEZH_IMAGE_AI_URL: ""
      KUTEZH_TEXT_AI_URL: ""
    volumes:
      - media:/var/lib/kutezh/media
      - secrets:/run/ostrov-secrets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, --max-time, "4", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
      - "127.0.0.1:${MODERATION_PORT:-8081}:8081"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/health && wget -q -O /dev/null http://127.0.0.1:8081/health']
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  postgres:
  media:
  secrets:
